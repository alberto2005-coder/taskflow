name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, test y build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # En CI solo existe la BD de pruebas (POSTGRES_DB: taskflow_test):
      # las migraciones del pipeline se aplican aquí, nunca en una BD de desarrollo.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskflow_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskflow_test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          # 24 = misma línea que el desarrollo local (jsdom 30 exige >=24.15)
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npm run prisma:generate -w apps/api

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Migraciones de la base de datos de pruebas
        run: npm run prisma:migrate:deploy -w apps/api

      - name: Tests (unitarios e integración)
        run: npm test

      - name: Build (API + Web)
        run: npm run build
